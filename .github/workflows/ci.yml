name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install toolchain
        run: mise install

      - name: Install project dependencies
        run: mise run setup

      - name: Run pre-commit checks
        run: mise exec -- python -m pre_commit run --all-files --show-diff-on-failure

      - name: Run full secret scan
        run: mise run secret-scan

      - name: Audit dependencies
        run: mise run audit

      - name: Run unit tests
        run: mise run test

      - name: Build application
        run: mise run build

      - name: Build Storybook
        run: mise run storybook

      - name: Generate SBOM
        run: mise run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install toolchain
        run: mise install

      - name: Install project dependencies
        run: |
          mise exec -- pnpm install --frozen-lockfile
          mise exec -- python -m pip install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19'
          mise exec -- python -m pip install -r requirements-dev.txt

      - name: Install Playwright browser and dependencies
        run: mise exec -- pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: mise run test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
